# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: ghostwriter

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.buildVersion={{ .Version }}

# The archive and checksum names are a contract: install.sh constructs them
# from the version, OS and arch.
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/kocieusz/ghostwriter/main/install.sh | sh
    ```
