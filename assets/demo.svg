<g class="e37"><circle cx="45" cy="486" r="10" fill="#1f6feb"/><text x="45" y="490" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="64" y="490.5" font-size="13" fill="#8b949e">score the agent&#x27;s draft: voice, AI tells, facts</text></g>
<g class="e38"><circle cx="45" cy="486" r="10" fill="#1f6feb"/><text x="45" y="490" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="64" y="490.5" font-size="13" fill="#8b949e">revise until it passes</text></g>
