<text class="e1" x="36" y="76" font-size="14" xml:space="preserve"><tspan class="e1s0" fill="#7ee787">$ </tspan><tspan class="e1s1" fill="#e6edf3">ghostwriter add ~/writing/</tspan></text>
<text class="e2" x="36" y="97" font-size="14" xml:space="preserve"><tspan class="e2s0" fill="#8b949e">  added 6 samples · answer, email, essay, report</tspan></text>
<text class="e3" x="36" y="128.5" font-size="14" xml:space="preserve"><tspan class="e3s0" fill="#7ee787">$ </tspan><tspan class="e3s1" fill="#e6edf3">ghostwriter analyze</tspan></text>
<text class="e4" x="36" y="149.5" font-size="14" xml:space="preserve"><tspan class="e4s0" fill="#8b949e">  your own samples score </tspan><tspan class="e4s1" fill="#3fb950">~80</tspan><tspan class="e4s2" fill="#8b949e"> · generic AI drafts </tspan><tspan class="e4s3" fill="#ff7b72">~23</tspan></text>
<text class="e5" x="36" y="170.5" font-size="14" xml:space="preserve"><tspan class="e5s0" fill="#8b949e">  → pass mark </tspan><tspan class="e5s1" fill="#e6edf3">77</tspan></text>
<text class="e6" x="36" y="202.0" font-size="14" xml:space="preserve"><tspan class="e6s0" fill="#7ee787">$ </tspan><tspan class="e6s1" fill="#e6edf3">ghostwriter install</tspan></text>
<text class="e7" x="36" y="223.0" font-size="14" xml:space="preserve"><tspan class="e7s0" fill="#8b949e">  installed skill </tspan><tspan class="e7s1" fill="#79c0ff">ghostwriter</tspan><tspan class="e7s2" fill="#8b949e"> in .agents/skills/</tspan></text>
<text class="e8" x="36" y="76" font-size="14" xml:space="preserve"><tspan class="e8s0" fill="#d2a8ff">you › </tspan><tspan class="e8s1" fill="#e6edf3">write a reply to Marta as me</tspan></text>
<text class="e9" x="36" y="97" font-size="14" xml:space="preserve"><tspan class="e9s0" fill="#8b949e">agent: drafting draft.md, pass 1</tspan></text>
<rect class="e16" x="24" y="107" width="832" height="157" rx="8" fill="#161b22" stroke="#30363d"/>
<text class="e10" x="36" y="129" font-size="13" xml:space="preserve"><tspan class="e10s0" fill="#c9d1d9">Hi Marta,</tspan></text>
<text class="e11" x="36" y="157" font-size="13" xml:space="preserve"><tspan class="e11s0" fill="#c9d1d9">Thank you for reaching out! I&#x27;m thrilled to confirm Thursday&#x27;s demo </tspan><tspan class="e11s1" fill="#c9d1d9">—</tspan></text>
<text class="e12" x="36" y="176" font-size="13" xml:space="preserve"><tspan class="e12s0" fill="#c9d1d9">it&#x27;s not just a meeting, it&#x27;s</tspan><tspan class="e12s1" fill="#c9d1d9"> a </tspan><tspan class="e12s2" fill="#c9d1d9">pivotal moment</tspan><tspan class="e12s3" fill="#c9d1d9"> for the project.</tspan></text>
<text class="e13" x="36" y="204" font-size="13" xml:space="preserve"><tspan class="e13s0" fill="#c9d1d9">I will ensure the slides are ready by Wednesday</tspan><tspan class="e13s1" fill="#c9d1d9">, highlighting</tspan><tspan class="e13s2" fill="#c9d1d9"> our </tspan><tspan class="e13s3" fill="#c9d1d9">robust</tspan></text>
<text class="e14" x="36" y="223" font-size="13" xml:space="preserve"><tspan class="e14s0" fill="#c9d1d9">progress. The payment API sandbox is down, and </tspan><tspan class="e14s1" fill="#c9d1d9">47</tspan><tspan class="e14s2" fill="#c9d1d9"> tickets are blocked.</tspan></text>
<text class="e15" x="36" y="251" font-size="13" xml:space="preserve"><tspan class="e15s0" fill="#c9d1d9">Let me know if you&#x27;d like me</tspan><tspan class="e15s1" fill="#c9d1d9"> to prepare anything else!</tspan></text>
<text class="e17" x="36" y="288" font-size="14" xml:space="preserve"><tspan class="e17s0" fill="#7ee787">$ </tspan><tspan class="e17s1" fill="#e6edf3">ghostwriter score draft.md -g email --source brief.md</tspan></text>
<text class="e18" x="36" y="317.4" font-size="14" font-weight="bold" xml:space="preserve"><tspan class="e18s0" fill="#e6edf3">Voice match </tspan><tspan class="e18s1" fill="#ff7b72">47.8</tspan><tspan class="e18s2" fill="#8b949e">/100</tspan><tspan class="e18s3" fill="#ff7b72">  ✗ needs work</tspan></text>
<text class="e19" x="36" y="338.4" font-size="14" xml:space="preserve"><tspan class="e19s0" fill="#8b949e">resemblance 76.8 − AI tells 24.0 − facts 5.0</tspan></text>
<text class="e20" x="36" y="363.59999999999997" font-size="14" xml:space="preserve"><tspan class="e20s0" fill="#ff7b72">  ✗ </tspan><tspan class="e20s1" fill="#8b949e">L4  </tspan><tspan class="e20s2" fill="#e3b341">&quot;not X but Y&quot; contrast  </tspan><tspan class="e20s3" fill="#8b949e">state the point directly</tspan></text>
<text class="e21" x="36" y="384.59999999999997" font-size="14" xml:space="preserve"><tspan class="e21s0" fill="#ff7b72">  ✗ </tspan><tspan class="e21s1" fill="#8b949e">L9  </tspan><tspan class="e21s2" fill="#e3b341">assistant wrapper       </tspan><tspan class="e21s3" fill="#8b949e">cut the offer, keep the content</tspan></text>
<text class="e22" x="36" y="405.59999999999997" font-size="14" xml:space="preserve"><tspan class="e22s0" fill="#ff7b72">  ✗ </tspan><tspan class="e22s1" fill="#8b949e">L7  </tspan><tspan class="e22s2" fill="#e3b341">invented number &quot;47&quot;    </tspan><tspan class="e22s3" fill="#8b949e">not in the brief</tspan></text>
<text class="e23" x="36" y="76" font-size="14" xml:space="preserve"><tspan class="e23s0" fill="#8b949e">agent: revising from the notes, pass 2</tspan></text>
<rect class="e31" x="24" y="86" width="832" height="176" rx="8" fill="#161b22" stroke="#30363d"/>
<text class="e24" x="36" y="108" font-size="13" xml:space="preserve"><tspan class="e24s0" fill="#c9d1d9">Hey Marta,</tspan></text>
<text class="e25" x="36" y="136" font-size="13" xml:space="preserve"><tspan class="e25s0" fill="#c9d1d9">Thursday works, I&#x27;ll be there. Slides will be ready by Wednesday, nothing</tspan></text>
<text class="e26" x="36" y="155" font-size="13" xml:space="preserve"><tspan class="e26s0" fill="#c9d1d9">fancy, just the numbers and a couple of screenshots.</tspan></text>
<text class="e27" x="36" y="183" font-size="13" xml:space="preserve"><tspan class="e27s0" fill="#c9d1d9">One thing though, the payment API sandbox is still down, so honestly I</tspan></text>
<text class="e28" x="36" y="202" font-size="13" xml:space="preserve"><tspan class="e28s0" fill="#c9d1d9">can&#x27;t show that part live. I&#x27;d rather tell them now than find out during</tspan></text>
<text class="e29" x="36" y="221" font-size="13" xml:space="preserve"><tspan class="e29s0" fill="#c9d1d9">the demo haha.</tspan></text>
<text class="e30" x="36" y="249" font-size="13" xml:space="preserve"><tspan class="e30s0" fill="#c9d1d9">Thanks a lot!</tspan></text>
<text class="e32" x="36" y="286" font-size="14" xml:space="preserve"><tspan class="e32s0" fill="#7ee787">$ </tspan><tspan class="e32s1" fill="#e6edf3">ghostwriter score draft.md -g email --source brief.md</tspan></text>
<text class="e33" x="36" y="315.4" font-size="14" font-weight="bold" xml:space="preserve"><tspan class="e33s0" fill="#e6edf3">Voice match </tspan><tspan class="e33s1" fill="#3fb950">82.5</tspan><tspan class="e33s2" fill="#8b949e">/100</tspan><tspan class="e33s3" fill="#3fb950">  ✓ pass</tspan></text>
<text class="e34" x="36" y="336.4" font-size="14" xml:space="preserve"><tspan class="e34s0" fill="#8b949e">resemblance 82.5 − AI tells 0.0 − facts 0.0</tspan></text>
<text class="e35" x="36" y="365.79999999999995" font-size="14" xml:space="preserve"><tspan class="e35s0" fill="#3fb950">→ </tspan><tspan class="e35s1" fill="#e6edf3">delivered in your voice, nothing invented</tspan></text>
